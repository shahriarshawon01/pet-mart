[supervisord]
nodaemon=true
logfile=/dev/fd/2
logfile_maxbytes=0
loglevel=info

[program:php-fpm]
command=/usr/local/bin/docker-php-entrypoint php-fpm
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;" -c /etc/nginx/nginx.conf
autostart=true
autorestart=true
stopsignal=QUIT
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; Processes queued jobs (SMS, notifications). Restarts hourly to release memory and pick up new code.
[program:queue-worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --backoff=10 --max-time=3600
autostart=true
autorestart=true
stopwaitsecs=60
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; Runs the Laravel scheduler (routes/console.php): listings:prune, sanctum:prune-expired.
; Run only one scheduler in total; with several app containers, disable this in all but one.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
